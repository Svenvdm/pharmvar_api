[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "pharmvar-api"
version = "0.1"
description = "Python wrapper for the PharmVar API"
requires-python = ">=3.12"
keywords = ["PharmVar", "pharmacogenomics", "api wrapper"]
authors = [
    {name = "Sven van der Maas", email = "svenvdm2013@gmail.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12"
]
[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[project.urls]
Repository = "https://github.com/Svenvdm/pharmvar_api"
